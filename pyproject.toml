[project]
name = "image-colorization"
version = "0.1.0"
description = "Deep learning model for colorizing black and white images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fiftyone>=0.23",
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=10.0",
    "numpy>=1.24",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[tool.uv]
package = false
